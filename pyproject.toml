[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "securityeval-project"
version = "0.1.0"
description = "Traceable SecurityEval code generation and evaluation contracts"
requires-python = ">=3.11,<3.12"
dependencies = ["jsonschema>=4.23,<5", "openai>=2,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
static = ["bandit>=1.8,<2"]

[project.scripts]
security-eval = "security_eval.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
security_eval = ["schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
pythonpath = ["src"]
addopts = "-ra"

markers = [
    "functional: candidate functional requirements",
    "security: candidate security requirements",
]